[package]
publish = false
name = "common"
description = "Shared helpers: Snowflake IDs, tracing setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-nats = "0.52.0"
metrics = "0.24"
metrics-exporter-opentelemetry = "0.2"
metrics-util = { version = "0.19", default-features = false }
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "logs", "metrics", "trace"], default-features = false }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
tracing.workspace = true
tracing-opentelemetry = "0.34"
tracing-subscriber.workspace = true
