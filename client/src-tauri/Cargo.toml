[package]
publish = false
name = "desktop"
description = "Tauri desktop shell. Thin glue: windows, tray, commands. Logic lives in client-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
client-core.workspace = true
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
sha2 = "0.10"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"

# Share Play: remote input on the host (Windows + X11 only, see issue #56).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
