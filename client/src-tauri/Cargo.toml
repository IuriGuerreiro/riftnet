[package]
name = "desktop"
description = "Tauri desktop shell. Thin glue: windows, tray, commands. Logic lives in client-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
client-core.workspace = true
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
