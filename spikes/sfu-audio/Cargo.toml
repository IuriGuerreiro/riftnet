[package]
name = "sfu-audio"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not part of the main workspace (throwaway spike).
[workspace]

[dependencies]
str0m = { version = "0.21", default-features = false, features = ["aws-lc-rs"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
