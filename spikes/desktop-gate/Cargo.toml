[package]
name = "desktop-gate"
description = "Gate spike: native screen capture -> hardware H.264 (libwebrtc) -> our SFU."
version = "0.1.0"
edition = "2024"
publish = false

# Not part of the main workspace: libwebrtc is a big download and build.
[workspace]

[dependencies]
protocol = { path = "../../libs/protocol" }
libwebrtc = "=0.4.0"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
anyhow = "1"
