syntax = "proto3";

package app.v1;

import "v1/users.proto";

// A DM (2 people) or a group DM (up to 5).
message Conversation {
  uint64 id = 1;
  ConversationKind kind = 2;
  repeated User members = 3;
  uint64 last_seq = 4; // seq of the newest message (0 = empty)
  string name = 5; // group name ("" for DMs)
  // Unix ms of the newest message, or of creation if there are none.
  // The list comes newest first; re-sort on MessageCreated.
  uint64 last_message_at = 6;
  // Your own unread messages here, capped at 10 (show "9+"). Only you see it.
  uint32 unread_count = 7;
  uint64 last_read_seq = 8; // your own read position (private)
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DM = 1;
  CONVERSATION_KIND_GROUP = 2;
}

// Open (or create) the 1-on-1 DM with someone, by username.
message OpenDm {
  string username = 1;
}

message ConversationResult {
  Conversation conversation = 1;
}

message ListConversations {}

message Conversations {
  repeated Conversation conversations = 1;
}

// --- group DMs (3-5 people) ---

message CreateGroup {
  string name = 1;
  repeated string usernames = 2;
  // Optional, 1-64 chars. A retry with the same nonce returns the same group
  // instead of making a second one. Add/leave/rename are safe to retry as-is.
  string nonce = 3;
}

message AddMember {
  uint64 conversation_id = 1;
  string username = 2;
}

message LeaveGroup {
  uint64 conversation_id = 1;
}

message RenameGroup {
  uint64 conversation_id = 1;
  string name = 2;
}

message ConversationUpdated {
  Conversation conversation = 1;
}

// --- read state (private: never sent to anyone but you) ---

// "I've read up to seq N here." Only moves forward; a lower seq is ignored.
message MarkRead {
  uint64 conversation_id = 1;
  uint64 seq = 2;
}

// Reply to MarkRead, and a push to all your sockets so every tab agrees.
message ReadStateUpdated {
  uint64 conversation_id = 1;
  uint64 last_read_seq = 2;
  uint32 unread_count = 3;
}
