syntax = "proto3";

package app.v1;

import "v1/users.proto";

// A DM (2 people) or a group DM (up to 5).
message Conversation {
  uint64 id = 1;
  ConversationKind kind = 2;
  repeated User members = 3;
  uint64 last_seq = 4;      // seq of the newest message (0 = empty)
  string name = 5;          // group name ("" for DMs)
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DM = 1;
  CONVERSATION_KIND_GROUP = 2;
}

// Open (or create) the 1-on-1 DM with someone, by username.
message OpenDm {
  string username = 1;
}

message ConversationResult {
  Conversation conversation = 1;
}

message ListConversations {}

message Conversations {
  repeated Conversation conversations = 1;
}

// --- group DMs (3-5 people) ---

message CreateGroup {
  string name = 1;
  repeated string usernames = 2;
}

message AddMember {
  uint64 conversation_id = 1;
  string username = 2;
}

message LeaveGroup {
  uint64 conversation_id = 1;
}

message RenameGroup {
  uint64 conversation_id = 1;
  string name = 2;
}

message ConversationUpdated {
  Conversation conversation = 1;
}