syntax = "proto3";

package app.v1;

message User {
  uint64 id = 1;
  string username = 2;
  string display_name = 3;
  // Hex BLAKE3 of the current avatar; empty = no avatar.
  // Image link: GET /users/{id}/avatar/{avatar_hash}?size=128|512 -> { url } (WebP).
  // A new hash means a new image, so clients can cache by hash forever.
  string avatar_hash = 4;
  string bio = 5; // empty = not set
  string custom_status = 6;
  // Hex id of the current banner; empty = none. Same rules as avatar_hash.
  // Image link: GET /users/{id}/banner/{banner_hash} -> { url } (WebP, 960x384).
  string banner_hash = 7;
  // "#rrggbb", lowercase; empty = not set.
  string accent_color = 8;
  string pronouns = 9; // empty = not set
}

// Pushed to the user, their friends and their DM/group members
// when any profile field changes (name, bio, status, avatar, banner,
// accent color, pronouns).
message UserUpdated {
  User user = 1;
}
