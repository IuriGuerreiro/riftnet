syntax = "proto3";

package app.v1;

import "v1/calls.proto";
import "v1/conversations.proto";
import "v1/friends.proto";
import "v1/messages.proto";
import "v1/presence.proto";
import "v1/users.proto";

// Every WebSocket frame is one Envelope.
// Requests carry an `id`; the reply carries the same `id`.
// Server pushes (new messages, presence) have id = 0.
//
// The FIRST frame on a new socket must be `authenticate`. Anything else
// before that gets an error and the socket is closed.
message Envelope {
  uint64 id = 1;

  oneof payload {
    Ping ping = 10;
    SendMessage send_message = 11;
    GetHistory get_history = 12;
    Authenticate authenticate = 13;
    OpenDm open_dm = 14;
    ListConversations list_conversations = 15;
    Sync sync = 16;
    CreateGroup create_group = 17;
    AddMember add_member = 18;
    LeaveGroup leave_group = 19;
    RenameGroup rename_group = 20;
    EditMessage edit_message = 22;
    DeleteMessage delete_message = 23;
    StartTyping start_typing = 21; // fire-and-forget: send with id 0, no reply
    SetIdle set_idle = 24;
    GetPresence get_presence = 25;
    AddReaction add_reaction = 26;
    RemoveReaction remove_reaction = 27;
    GetReactors get_reactors = 28;
    MarkRead mark_read = 29;
    SendChannelMessage send_channel_message = 30;
    GetChannelHistory get_channel_history = 31;
    SetActivity set_activity = 32;
    GetActivities get_activities = 33;
    JoinFriendCall join_friend_call = 34;
    Activities activities = 76;

    Pong pong = 50;
    Error error = 51;
    MessageAck message_ack = 52;
    History history = 53;
    AuthOk auth_ok = 56;
    ConversationResult conversation = 57;
    Conversations conversations = 58;
    SyncResult sync_result = 59;
    EditMessageAck edit_message_ack = 63;
    DeleteMessageAck delete_message_ack = 64;
    Presences presences = 67;
    ReactionAck reaction_ack = 69;
    Reactors reactors = 70;

    MessageCreated message_created = 54;
    UserUpdated user_updated = 55;
    ConversationUpdated conversation_updated = 60;
    FriendUpdated friend_updated = 61;
    MessageUpdated message_updated = 65;
    MessageDeleted message_deleted = 66;
    TypingStarted typing_started = 62;
    PresenceUpdated presence_updated = 68;
    ReactionUpdated reaction_updated = 71;
    ReadStateUpdated read_state_updated = 72; // reply to MarkRead, and a push to your own sockets
    ChannelHistory channel_history = 73;
    ChannelMessage channel_message = 74;
    ServerRemoved server_removed = 75;
    ServerMemberUpdated server_member_updated = 77;

    // calls: field numbers 100-139 are reserved for them
    CallStart call_start = 100;
    CallAccept call_accept = 101;
    CallDecline call_decline = 102;
    CallJoin call_join = 103;
    CallScreenShare call_screen_share = 104;
    CallLeave call_leave = 105;
    CallControl call_control = 106;
    CallResult call_result = 120;
    CallJoined call_joined = 121;
    CallIncoming call_incoming = 130;
    CallUpdated call_updated = 131;
    CallEnded call_ended = 133;
  }
}

message Ping {}
message Pong {}

message Error {
  string code = 1;
  string message = 2;
  // Set on "rate_limited": wait this long before retrying.
  uint64 retry_after_ms = 3;
}

message Authenticate {
  string access_token = 1;
}

message AuthOk {
  User user = 1;
}

message ServerRemoved {
  uint64 server_id = 1;
}

// Pushed to every member of a server when a member's nickname changes.
message ServerMemberUpdated {
  uint64 server_id = 1;
  uint64 user_id = 2;
  string nickname = 3; // empty = no nickname
  string name = 4; // name to show in this server: nickname, else display name or username
}
