syntax = "proto3";

package app.v1;

enum CallState {
  CALL_STATE_UNSPECIFIED = 0;
  CALL_STATE_RINGING = 1;
  CALL_STATE_ACTIVE = 2;
}

message Call {
  uint64 id = 1;
  uint64 conversation_id = 2;
  uint64 caller_id = 3;
  CallState state = 4;
  repeated uint64 participant_ids = 5;
  repeated uint64 sharing_user_ids = 6;
}

message CallStart {
  uint64 conversation_id = 1;
}
message CallAccept {
  uint64 call_id = 1;
}
message CallDecline {
  uint64 call_id = 1;
}
message CallJoin {
  uint64 call_id = 1;
  string sdp_offer = 2;
}
message CallLeave {
  uint64 call_id = 1;
}
message CallScreenShare {
  uint64 call_id = 1;
  bool sharing = 2;
}

message CallResult {
  Call call = 1;
}
message CallJoined {
  Call call = 1;
  string sdp_answer = 2;
}

message CallIncoming {
  Call call = 1;
}
message CallUpdated {
  Call call = 1;
}

enum CallEndReason {
  CALL_END_REASON_UNSPECIFIED = 0;
  CALL_END_REASON_HANGUP = 1;
  CALL_END_REASON_DECLINED = 2;
  CALL_END_REASON_MISSED = 3;
}
message CallEnded {
  uint64 call_id = 1;
  uint64 conversation_id = 2;
  CallEndReason reason = 3;
}
