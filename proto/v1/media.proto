syntax = "proto3";

package app.v1;

// Internal: api <-> media (SFU) over NATS. Clients never see these.
//
// Subjects:
//   media.join   request/reply  MediaJoin -> MediaJoinReply
//   media.leave  publish        MediaLeave

message MediaJoin {
  uint64 room_id = 1;
  string sdp_offer = 2;
}

message MediaJoinReply {
  uint64 peer_id = 1;
  string sdp_answer = 2;
  string error = 3;
}

message MediaLeave {
  uint64 peer_id = 1;
}
