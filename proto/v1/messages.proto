syntax = "proto3";

package app.v1;

message Message {
  uint64 id = 1; // Snowflake (also encodes the send time)
  uint64 conversation_id = 2;
  uint64 author_id = 3;
  uint64 seq = 4; // 1, 2, 3... per conversation, for sync
  bytes content = 5; // opaque: UTF-8 text now, encrypted later
  Encryption encryption = 6;
}

enum Encryption {
  ENCRYPTION_NONE = 0;
  ENCRYPTION_MLS = 1;
}

message SendMessage {
  uint64 conversation_id = 1;
  bytes content = 2;
  string nonce = 3; // client-made; dedupe + match the ack
}

message MessageAck {
  string nonce = 1;
  Message message = 2;
}

// Scrolling up: messages older than `before_id` (0 = newest).
message GetHistory {
  uint64 conversation_id = 1;
  uint64 before_id = 2;
  uint32 limit = 3; // max 100
}

message History {
  repeated Message messages = 1; // newest first
}

// Reconnect: "I have up to seq N, send me what I missed".
message Sync {
  uint64 conversation_id = 1;
  uint64 after_seq = 2;
}

message SyncResult {
  repeated Message messages = 1; // oldest first
  bool complete = 2; // false = too many missed: these are the newest; load older with GetHistory
}

// Push: a new message in a conversation you're in.
message MessageCreated {
  Message message = 1;
}
