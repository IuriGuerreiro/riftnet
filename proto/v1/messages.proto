syntax = "proto3";

package app.v1;

message Message {
  uint64 id = 1;
  uint64 conversation_id = 2;
  uint64 author_id = 3;
  uint64 seq = 4;
  bytes content = 5; // opaque: UTF-8 text now, encrypted later
  Encryption encryption = 6;
  uint64 edited_at = 7; // unix ms of the last edit, 0 = never edited
  repeated Attachment attachments = 8; // fixed once sent; edits don't change them
  // Filled in History, Sync and ReactionAck, for the user asking (`me`).
  // Empty in MessageCreated/MessageUpdated pushes and EditMessageAck:
  // keep the reactions you already have and apply ReactionUpdated pushes.
  repeated Reaction reactions = 9;
  uint64 reply_to = 10; // id of the message this replies to (same conversation), 0 = not a reply
}

// One emoji on a message: how many people used it, and whether you did.
message Reaction {
  string emoji = 1; // a Unicode emoji, max 32 bytes
  uint32 count = 2;
  bool me = 3;
}

// A file on a message. Upload it first over HTTP (POST /attachments, chunks,
// complete), then put its id in SendMessage.attachment_ids. To download, call
// GET /attachments/{id} for a short-lived link, then check the file's BLAKE3.
// Images and videos in unencrypted chats also carry preview_url: a link the
// browser can show inline (<img>/<video>). It is signed when the message is sent
// to you, never stored, and lasts up to 1h. When it stops working, get a fresh
// one from GET /attachments/{id}/preview.
message Attachment {
  uint64 id = 1;
  string filename = 2;
  string content_type = 3;
  uint64 size = 4; // bytes
  bytes blake3 = 5; // 32-byte BLAKE3 of the whole file
  uint64 expires_at = 6; // unix ms; after this the file is gone, show "expired"
  string preview_url = 7; // empty unless image/* or video/* in an unencrypted chat
}

enum Encryption {
  ENCRYPTION_NONE = 0;
  ENCRYPTION_MLS = 1;
}

message SendMessage {
  uint64 conversation_id = 1;
  bytes content = 2;
  string nonce = 3; // client-made; dedupe + match the ack
  // Finished uploads (max 10) from this sender, in this conversation, not on
  // another message yet. content may be empty when this isn't.
  repeated uint64 attachment_ids = 4;
  // Optional: a message in this conversation to reply to. 0 = not a reply.
  uint64 reply_to = 5;
}

message MessageAck {
  string nonce = 1;
  Message message = 2;
}

message GetHistory {
  uint64 conversation_id = 1;
  uint64 before_id = 2;
  uint32 limit = 3;
}

message History {
  repeated Message messages = 1; // newest first
}

message Sync {
  uint64 conversation_id = 1;
  uint64 after_seq = 2;
}

message SyncResult {
  repeated Message messages = 1; // oldest first
  bool complete = 2; // false = too many missed: these are the newest; load older with GetHistory
  repeated Message edited = 3; // older messages edited since after_seq (current version)
  repeated uint64 deleted_ids = 4; // messages deleted since after_seq
  uint64 last_seq = 5; // you're now up to here: use it as the next after_seq
}

message MessageCreated {
  Message message = 1;
}

// Edits and deletes take a seq too (like a new message), so sync can tell
// you about them. `seq` below is that change's number, not the message's.

// Only the author can edit. Same limits as SendMessage.
message EditMessage {
  uint64 conversation_id = 1;
  uint64 message_id = 2;
  bytes content = 3;
}

message EditMessageAck {
  Message message = 1;
  uint64 seq = 2;
}

// Only the author can delete. The message is gone for good (hard delete).
// Deleting one that's already gone is fine (seq = 0, no push).
message DeleteMessage {
  uint64 conversation_id = 1;
  uint64 message_id = 2;
}

message DeleteMessageAck {
  uint64 conversation_id = 1;
  uint64 message_id = 2;
  uint64 seq = 3;
}

// Push: a message was edited.
message MessageUpdated {
  Message message = 1;
  uint64 seq = 2;
}

// Push: a message was deleted.
message MessageDeleted {
  uint64 conversation_id = 1;
  uint64 message_id = 2;
  uint64 seq = 3;
}

// Client -> server: "I'm typing here". Fire-and-forget (id 0, no reply).
// Ephemeral, never stored. At most one per 3s per user per conversation;
// extras are dropped silently.
message StartTyping {
  uint64 conversation_id = 1;
}

// Push to the other members: show "X is typing…" for ~8s,
// or until X's next message arrives.
message TypingStarted {
  uint64 conversation_id = 1;
  uint64 user_id = 2;
}

// Reactions. Any member can react. Max 20 different emojis per message
// (adding to one already there always works). Max 10 adds/removes per 10s
// per user ("rate_limited"). Adding twice or removing one you don't have is
// fine: seq = 0 and no push. Each real change takes a seq (like an edit), so
// Sync returns the message in `edited` with its current reactions.
message AddReaction {
  uint64 conversation_id = 1;
  uint64 message_id = 2;
  string emoji = 3;
}

message RemoveReaction {
  uint64 conversation_id = 1;
  uint64 message_id = 2;
  string emoji = 3;
}

// Reply to AddReaction and RemoveReaction: the message's reactions now.
message ReactionAck {
  uint64 conversation_id = 1;
  uint64 message_id = 2;
  uint64 seq = 3;
  repeated Reaction reactions = 4;
}

// Push to every member (you too): someone added or removed a reaction.
// `count` is the new total for that emoji (0 = remove the chip).
message ReactionUpdated {
  uint64 conversation_id = 1;
  uint64 message_id = 2;
  string emoji = 3;
  uint64 user_id = 4;
  bool added = 5;
  uint32 count = 6;
  uint64 seq = 7;
}

// Who reacted with this emoji (for the tooltip). Max 100 ids.
message GetReactors {
  uint64 conversation_id = 1;
  uint64 message_id = 2;
  string emoji = 3;
}

message Reactors {
  repeated uint64 user_ids = 1;
}

message SendChannelMessage {
  uint64 channel_id = 1;
  string text = 2;
  string nonce = 3;
}

message GetChannelHistory {
  uint64 channel_id = 1;
  uint64 before_id = 2;
}

message ChannelMessage {
  uint64 id = 1;
  uint64 channel_id = 2;
  uint64 author_id = 3;
  string author_name = 4;
  string text = 5;
}

message ChannelHistory {
  repeated ChannelMessage messages = 1;
  uint64 next_before_id = 2; // 0 when there are no older messages
}
