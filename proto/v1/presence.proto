syntax = "proto3";

package app.v1;

// Who is online. See docs/architecture/presence.md.
//
// Online = at least one open socket. Idle = every open socket says idle.
// Offline = no socket. Only friends and people you share a DM/group with
// can see your status.

enum PresenceStatus {
  PRESENCE_STATUS_OFFLINE = 0;
  PRESENCE_STATUS_ONLINE = 1;
  PRESENCE_STATUS_IDLE = 2;
  PRESENCE_STATUS_DO_NOT_DISTURB = 3;
}

// Push (id 0): someone you can see changed status.
// Also the item type of `Presences`.
message PresenceUpdated {
  uint64 user_id = 1;
  PresenceStatus status = 2;
  uint64 revision = 3;
}

// This socket went idle (no input for a while, window hidden) or came back.
// Reply: `Pong`.
message SetIdle {
  bool idle = 1;
}

// Current status of these users. Users you can't see (not a friend, no
// shared DM) are left out. Max 200 ids.
message GetPresence {
  repeated uint64 user_ids = 1;
}

message Presences {
  repeated PresenceUpdated presences = 1;
}

// Activity is opt-in and visible only to accepted friends.
message SetActivity {
  string label = 1; // Empty clears this connection's activity.
}
message GetActivities {
  repeated uint64 user_ids = 1;
}
message FriendActivity {
  uint64 user_id = 1;
  string label = 2;
  bool streaming = 3;
  bool joinable = 4;
}
message Activities {
  repeated FriendActivity activities = 1;
}
// Resolve the friend's current call again during admission.
message JoinFriendCall {
  uint64 friend_id = 1;
  string sdp_offer = 2;
}
