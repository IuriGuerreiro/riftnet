[workspace]
resolver = "2"
members = [
    "services/api",
    "services/media",
    "libs/client-core",
    "libs/common",
    "libs/protocol",
    "client/src-tauri",
    "tools/loadtest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
common = { path = "libs/common" }
protocol = { path = "libs/protocol" }
client-core = { path = "libs/client-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prost = "0.13"
anyhow = "1"
