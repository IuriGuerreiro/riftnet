# cargo-deny: checks Rust dependencies for security advisories, licenses,
# banned crates and unknown sources. Run: cargo deny check

[graph]
all-features = true

[advisories]
# RustSec database. Vulnerable crates fail; unmaintained ones only in our direct deps.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # chrono: unmaintained, not vulnerable. sqlx and scylla depend on it, so it cannot be dropped yet.
  { id = "RUSTSEC-2026-0543", reason = "transitive via sqlx and scylla; unmaintained only" },
]

[licenses]
# Project is AGPL-3.0; everything below is compatible with it.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "AGPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
