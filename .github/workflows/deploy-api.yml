name: Deploy API

on:
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/prod/rust.Dockerfile
          build-args: BIN=api
          platforms: linux/amd64
          tags: ghcr.io/iuriguerreiro/discord2.0-api:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    concurrency:
      group: prod-api-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - id: prod
        name: Check for a newer prod commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" --jq .object.sha)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping deploy because prod moved to $head."
          fi
      - name: Connect to the production tailnet
        if: steps.prod.outputs.current == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.PROD_API_TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.PROD_API_TAILSCALE_AUDIENCE }}
          tags: tag:ci-api
      - name: Update the API and check public health
        if: steps.prod.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          API_HOST: ${{ vars.PROD_API_DEPLOY_HOST }}
          API_HTTP: ${{ vars.PROD_API_HTTP }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          [[ "$API_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$API_HTTP" == https://* ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$GH_TOKEN" | tailscale ssh "discord2-deploy@$API_HOST" \
            "sudo -n /etc/discord2-api/deploy-api.sh deploy '$IMAGE_DIGEST' '$GITHUB_ACTOR'"
          health=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 10 "${API_HTTP%/}/health")
          [[ "$health" == ok ]]
