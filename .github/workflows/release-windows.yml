name: Release Windows app

on:
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Build Windows executable
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          VITE_API_HTTP: ${{ vars.PROD_API_HTTP }}
          VITE_API_WS: ${{ vars.PROD_API_WS }}
        run: |
          if (([uri]$env:VITE_API_HTTP).Scheme -ne 'https' -or ([uri]$env:VITE_API_WS).Scheme -ne 'wss') {
            throw 'Set PROD_API_HTTP to the production HTTPS URL and PROD_API_WS to the production WSS URL.'
          }
          pnpm --filter client tauri build --target x86_64-pc-windows-msvc --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/x86_64-pc-windows-msvc/release/desktop.exe discord2-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: discord2-windows-x64
          path: discord2-windows-x64.exe
          if-no-files-found: error
          overwrite: true

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: discord2-windows-x64
      - name: Create or complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="windows-$GITHUB_SHA"
          asset=discord2-windows-x64.exe
          if release=$(gh release view "$tag" --json targetCommitish,isDraft,assets); then
            jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' <<< "$release" >/dev/null
            if jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset and .state == "uploaded" and .size > 0)' <<< "$release" >/dev/null; then
              exit 0
            fi
            jq -e '.isDraft' <<< "$release" >/dev/null
            gh release upload "$tag" "$asset" --clobber
          else
            refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag")
            jq -e --arg ref "refs/tags/$tag" --arg sha "$GITHUB_SHA" \
              'all(.[] | select(.ref == $ref); .object.sha == $sha)' <<< "$refs" >/dev/null
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --draft \
              --title "Windows app (${GITHUB_SHA:0:12})" --generate-notes
          fi
