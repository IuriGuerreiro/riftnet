name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    # New advisories show up without code changes: re-audit weekly (Mon 06:00 UTC).
    - cron: "0 6 * * 1"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Placeholder frontend dist (needed by tauri::generate_context!)
        run: mkdir -p client/dist && echo '<html></html>' > client/dist/index.html
      - run: node tools/lint/check-rust-comments.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Postgres, Scylla, NATS, Redis, MinIO
        run: docker compose -f infra/docker-compose.yml up -d postgres scylla nats redis minio
      - name: Wait for Postgres and Scylla
        run: |
          for i in $(seq 1 90); do
            docker compose -f infra/docker-compose.yml exec -T postgres pg_isready -U app >/dev/null 2>&1 \
              && docker compose -f infra/docker-compose.yml exec -T scylla cqlsh -e 'SELECT now() FROM system.local' >/dev/null 2>&1 \
              && exit 0
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs scylla | tail -50
          exit 1
      - name: Integration tests
        run: cargo test -p api --test integration -- --ignored
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 100 postgres scylla nats

  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm format:check
      - run: pnpm exec eslint . --ignore-pattern "design/**"
      - run: pnpm --filter '!design' -r typecheck
      - run: pnpm test
      - run: pnpm --filter '!design' -r build

  design:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter design exec tsc --noEmit -p .
      - run: pnpm exec eslint design
      - run: pnpm --filter design run build

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # breaking check compares against the base branch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm proto:lint
      - name: Breaking change check (PRs only)
        if: github.event_name == 'pull_request'
        working-directory: client
        run: pnpm exec buf breaking ../proto --against "../.git#branch=origin/${{ github.base_ref }},subdir=proto"

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm audit --prod

  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API and media images (not published)
        run: |
          for bin in api media; do
            docker buildx build --platform linux/amd64 --build-arg "BIN=$bin" -f infra/prod/rust.Dockerfile .
          done
      - name: Check deploy scripts and Compose files
        run: |
          shellcheck infra/prod/*.sh scripts/media-fingerprint.sh
          export DEPLOY_IMAGE=test DEPLOY_PROJECT=test
          docker compose --env-file infra/prod/.env.example -f infra/prod/compose.yml -f infra/prod/compose.api-deploy.yml config --quiet
          docker compose --env-file infra/prod/media/.env.example -f infra/prod/media/compose.yml -f infra/prod/media/compose.deploy.yml config --quiet
