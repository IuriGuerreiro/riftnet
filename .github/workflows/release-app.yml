name: Release app

# Publishes the desktop app when prod has an app version without a release yet.
# Bump `version` in client/src-tauri/tauri.conf.json to ship a new one.
on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown in the app
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release

env:
  DESKTOP_RELEASE_REPO: ${{ github.repository }}
  RELEASE_NOTES: ${{ inputs.notes }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(jq -r .version client/src-tauri/tauri.conf.json)"
          skip() { echo "::notice::No desktop release: $1"; echo needed=false >> "$GITHUB_OUTPUT"; }
          if [[ "$GITHUB_REF" != refs/heads/prod ]]; then
            echo "Run Release app from the prod branch." >&2
            exit 1
          elif [[ "$(gh repo view "$GH_REPO" --json visibility --jq .visibility)" != PUBLIC ]]; then
            skip "the repository is private. Installed apps download updates without logging in."
          elif [[ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            skip "$tag is already published. Bump the app version to release."
          else
            echo "Releasing $tag"
            echo needed=true >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: check
    if: needs.check.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    environment: desktop-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            bundle: nsis
            bundle_dir: nsis
            pattern: "*-setup.exe"
            asset: adept-windows-x64-setup.exe
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      VITE_API_HTTP: ${{ vars.PROD_API_HTTP }}
      VITE_API_WS: ${{ vars.PROD_API_WS }}
      VITE_DESKTOP_UPDATES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check production API URLs
        shell: bash
        run: |
          node <<'JS'
          for (const [name, value, protocol] of [
            ['PROD_API_HTTP', process.env.VITE_API_HTTP, 'https:'],
            ['PROD_API_WS', process.env.VITE_API_WS, 'wss:'],
          ]) {
            if (URL.parse(value)?.protocol !== protocol) {
              throw new Error(`Set ${name} to the production ${protocol.slice(0, -1).toUpperCase()} URL.`);
            }
          }
          JS
      - run: pnpm install --frozen-lockfile
      - name: Configure the release updater
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node tools/release/desktop.mjs config "${{ runner.temp }}/adept-release.json"
      - name: Build and sign desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter client tauri build --config "${{ runner.temp }}/adept-release.json" --bundles ${{ matrix.bundle }} -- --locked
      - name: Stage bundle and signature
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          BUNDLE_PATTERN: ${{ matrix.pattern }}
          ASSET: ${{ matrix.asset }}
        run: |
          shopt -s nullglob
          bundles=(target/release/bundle/"$BUNDLE_DIR"/$BUNDLE_PATTERN)
          if (( ${#bundles[@]} != 1 )) || [[ ! -s "${bundles[0]}.sig" ]]; then
            echo "Expected one bundle and its signature for $ASSET" >&2
            exit 1
          fi
          mkdir release-assets
          cp "${bundles[0]}" "release-assets/$ASSET"
          cp "${bundles[0]}.sig" "release-assets/$ASSET.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: adept-*
          path: release-assets
          merge-multiple: true
      - name: Generate release manifest
        working-directory: release-assets
        run: node ../tools/release/desktop.mjs manifest
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-manifest
          path: release-assets/latest.json
          if-no-files-found: error
          overwrite: true
      - name: Publish the GitHub release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(jq -r .version latest.json)"
          notes_file="$(mktemp)"
          printf '%s\n\n<!-- source-commit: %s -->\n' "$RELEASE_NOTES" "$GITHUB_SHA" > "$notes_file"
          assets=(adept-*.exe adept-*.sig latest.json)
          if ! is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "Adept $tag" --notes-file "$notes_file" --latest
          elif [[ "$is_draft" == true ]]; then
            # Leftover draft: replace its files and publish it.
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file "$notes_file" --target "$GITHUB_SHA" --draft=false --latest
          else
            echo "::notice::$tag was published by another run. Nothing to do."
          fi
