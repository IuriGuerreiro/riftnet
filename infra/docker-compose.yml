# Local dev dependencies. Start: docker compose -f infra/docker-compose.yml up -d
# Host ports are moved off the defaults to avoid clashing with other local services.
name: discord2

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 30
      start_period: 30s

  scylla:
    image: scylladb/scylla:2025.1
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1
    ports: ["127.0.0.1:9042:9042"]
    volumes: [scylla:/var/lib/scylla]

  nats:
    image: nats:2.11
    command: ["-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]

  redis:
    image: redis:8
    ports: ["127.0.0.1:6379:6379"]

  # S3-compatible file store for attachments (R2 in production).
  # The api creates the bucket on start. Console: http://localhost:7107
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z # community build; minio/minio left Docker Hub
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-dev-secret
    ports: ["127.0.0.1:7106:9000", "127.0.0.1:7107:9001"]
    volumes: [minio:/data]

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.6.2
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: "MasterkeyNeedsToHave32Characters"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 7102
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: app
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: app
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # bcrypt cost 12 (~0.25s per login) instead of Zitadel's default 14 (~1s).
      # Each step doubles the time. See docs/architecture/identity-auth.md.
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_HASHER_ALGORITHM: bcrypt
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_HASHER_COST: 12
      # First boot creates a service account for the api and writes its token
      # (PAT) to infra/.secrets/api.pat. Only on a fresh database.
      ZITADEL_FIRSTINSTANCE_PATPATH: /secrets/api.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: api-service
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: api
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
    volumes:
      - ./.secrets:/secrets
    ports: ["127.0.0.1:7102:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minio:
  postgres:
  scylla:
